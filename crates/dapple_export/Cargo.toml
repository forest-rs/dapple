[package]
name = "dapple_export"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Exports dapple materials as self-describing results: packed textures, one account of every parameter, a glTF material and a versioned manifest"
readme = "README.md"
keywords = ["material", "gltf", "openpbr", "no_std"]
categories = ["graphics", "encoding", "no-std"]

[dependencies]
dapple_encode.workspace = true
dapple_field.workspace = true
dapple_lab.workspace = true
dapple_material.workspace = true
libm.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[features]
default = []
# Writing exports into directories, with PNG textures.
std = ["dapple_encode/std"]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []

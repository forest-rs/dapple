[package]
name = "dapple_logic"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Small typed expressions over a dapple package's parameters, compiled to one verified execution_tape program and evaluated bit for bit as Rust's f32 arithmetic and libm"
readme = "README.md"
keywords = ["procedural", "expression", "deterministic", "no_std"]
categories = ["graphics", "no-std"]

[dependencies]
execution_tape.workspace = true

[dev-dependencies]
# The reference the tests hold every operation to: dapple's native modules
# compute with `libm`.
libm.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []

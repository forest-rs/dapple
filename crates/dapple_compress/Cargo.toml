[package]
name = "dapple_compress"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Block compression (BC7/BC5, ASTC) and Zstandard supercompression of dapple textures, through ctt"
readme = "README.md"
keywords = ["texture", "ktx2", "bc7", "astc"]
categories = ["graphics", "encoding"]

[dependencies]
# Pinned exactly: compressed bytes depend on the encoder version.
ctt = { default-features = false, features = [
    "encoder-astcenc",
    "encoder-intel",
    "ispc-prebuilt",
], version = "=0.5.0" }
dapple_encode.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = []

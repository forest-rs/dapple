[package]
name = "dapple_bake"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Bakes the dapple material recipes a manifest lists into textures."
publish = false

[dependencies]
dapple_compress.workspace = true
dapple_encode = { features = ["std"], workspace = true }
dapple_field.workspace = true
dapple_graph = { features = ["serde"], workspace = true }
dapple_raster.workspace = true
# The runtime, session and capture features are for `--profile`; the library
# itself emits through the featureless API.
footfall = { features = ["runtime", "session"], workspace = true }
serde.workspace = true
toml.workspace = true

[lints]
workspace = true

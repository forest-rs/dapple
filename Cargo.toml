[workspace]
resolver = "2"
members = [
    "crates/dapple_compress",
    "crates/dapple_encode",
    "crates/dapple_exedra",
    "crates/dapple_field",
    "crates/dapple_graph",
    "crates/dapple_imaging",
    "crates/dapple_library",
    "crates/dapple_raster",
    "examples/field_gallery",
    "examples/imaging_gallery",
    "examples/timber_bake",
    "tools/dapple_bake",
]

[workspace.package]
edition = "2024"
# Keep in sync with RUST_MIN_VER in .github/workflows/ci.yml, with the relevant README.md files
# and with the MSRV in the `Unreleased` section of CHANGELOG.md.
rust-version = "1.92"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/forest-rs/dapple"

[workspace.lints]
# LINEBENDER LINT SET - Cargo.toml - v8
# See https://linebender.org/wiki/canonical-lints/
rust.keyword_idents_2024 = "forbid"
rust.non_ascii_idents = "forbid"
rust.non_local_definitions = "forbid"
rust.unsafe_op_in_unsafe_fn = "forbid"

rust.elided_lifetimes_in_paths = "warn"
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.trivial_numeric_casts = "warn"
rust.unnameable_types = "warn"
rust.unreachable_pub = "warn"
rust.unused_import_braces = "warn"
rust.unused_lifetimes = "warn"
rust.unused_macro_rules = "warn"
rust.unused_qualifications = "warn"

rust.unsafe_code = "deny"

clippy.too_many_arguments = "allow"

clippy.allow_attributes_without_reason = "warn"
clippy.cast_possible_truncation = "warn"
clippy.cast_possible_wrap = "warn"
clippy.collection_is_never_read = "warn"
clippy.dbg_macro = "warn"
clippy.debug_assert_with_mut_call = "warn"
clippy.default_trait_access = "warn"
clippy.doc_markdown = "warn"
clippy.fn_to_numeric_cast_any = "warn"
clippy.infinite_loop = "warn"
clippy.large_stack_arrays = "warn"
clippy.mismatching_type_param_order = "warn"
clippy.missing_assert_message = "warn"
clippy.missing_fields_in_debug = "warn"
clippy.same_functions_in_if_condition = "warn"
clippy.semicolon_if_nothing_returned = "warn"
clippy.should_panic_without_expect = "warn"
clippy.todo = "warn"
clippy.unseparated_literal_suffix = "warn"
clippy.use_self = "warn"

clippy.cargo_common_metadata = "warn"
clippy.negative_feature_names = "warn"
clippy.redundant_feature_names = "warn"
clippy.wildcard_dependencies = "warn"
# END LINEBENDER LINT SET

# Prefer using `#[expect(...)]` instead of `#[allow(...)]`.
# `#[expect(...)]` warns when the suppressed lint no longer fires.
clippy.allow_attributes = "warn"

[workspace.dependencies]
dapple_compress = { path = "crates/dapple_compress" }
dapple_encode = { path = "crates/dapple_encode" }
dapple_exedra = { path = "crates/dapple_exedra" }
dapple_field = { path = "crates/dapple_field" }
dapple_graph = { path = "crates/dapple_graph" }
dapple_imaging = { path = "crates/dapple_imaging" }
dapple_library = { path = "crates/dapple_library" }
dapple_raster = { path = "crates/dapple_raster" }
# Pinned to forest-rs/execution main at the merge of #99 (scoped drains under
# early cutoff, on top of #97 and #98), which no crates.io release contains
# yet.
execution_graph = { default-features = false, git = "https://github.com/forest-rs/execution", rev = "ce961177dc05a7d0742b88c46c33cb5b49a8fdc1" }
# Pinned to one forest-rs/exedra main commit (after the merge of #98, with the
# keyed hash contract, tangents, attribute streams and layer propagation);
# no crates.io release contains them yet. Keep every exedra crate on the same
# revision.
exedra_assembly = { git = "https://github.com/forest-rs/exedra", rev = "b233b2c9608dcc424cf667b35299c4ddb1966112" }
exedra_constructive = { git = "https://github.com/forest-rs/exedra", rev = "b233b2c9608dcc424cf667b35299c4ddb1966112" }
exedra_gltf = { git = "https://github.com/forest-rs/exedra", rev = "b233b2c9608dcc424cf667b35299c4ddb1966112" }
exedra_math = { default-features = false, features = ["libm"], git = "https://github.com/forest-rs/exedra", rev = "b233b2c9608dcc424cf667b35299c4ddb1966112" }
exedra_mesh = { default-features = false, features = ["libm"], git = "https://github.com/forest-rs/exedra", rev = "b233b2c9608dcc424cf667b35299c4ddb1966112" }
glam = { default-features = false, features = ["libm"], version = "0.33.8" }
# Pinned to forest-rs/imaging main; its CPU backends are not on crates.io.
imaging = { default-features = false, features = ["libm"], git = "https://github.com/forest-rs/imaging", rev = "89b364b253bd4a07732e0fb1de95ae1b313cf588" }
imaging_vello_cpu = { default-features = false, features = ["libm"], git = "https://github.com/forest-rs/imaging", rev = "89b364b253bd4a07732e0fb1de95ae1b313cf588" }
invalidation = { default-features = false, version = "0.2.0" }
libm = "0.2.16"
png = "0.18.1"
serde = { default-features = false, features = ["alloc", "derive"], version = "1.0.228" }
serde_json = "1.0.145"
toml = "1.1.6"
